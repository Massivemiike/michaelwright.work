name: CI

on:
  push:
  pull_request:

# Avoid piling up redundant runs when a branch is pushed to repeatedly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No lint step: this repo has no ESLint config (`eslint.config.*` /
      # `.eslintrc*`) checked in yet. Add one here if/when that changes —
      # don't invent a config just to have a lint step.

      - name: Typecheck
        run: npx tsc --noEmit

      # Fast Vitest suite (~1-2s, 136 passed / 5 skipped as of Plan 2). This
      # includes src/game/test/lazy-boundary.test.ts, the source-level
      # import-graph bundle-budget gate: no marketing/layout file may import
      # @/game/** by alias OR by a relative path that resolves into
      # src/game/**. It also runs the sim purity guard and the determinism
      # golden-fixture gate.
      #
      # Deliberately NOT run here: `BALANCE_SWEEP=1 npm test`, the gated
      # slow balance sweep (~4 min) — that's a separate scheduled/manual
      # job, not a per-commit check. Cross-engine Playwright determinism
      # (golden replay reproduced in Chromium/Firefox/WebKit, Plan 3B Task
      # 8) is a separate Playwright-driven check in the browser-smokes job
      # below, not part of this fast Vitest step.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Build-output-level bundle-budget check (complements, doesn't
      # replace, the source-level import-graph test above): confirms the
      # actual compiled production output never references game-engine code
      # from a prerendered marketing route's initial HTML. See
      # scripts/check-bundle-budget.mjs for the full method and its known
      # limitations (fully dynamic routes with no prerendered HTML, e.g.
      # /blog, aren't scanned by this step — they're covered by the
      # source-level test instead).
      - name: Bundle budget (build-output check)
        run: npm run check:bundle-budget

  browser-smokes:
    name: WebGPU render + Canvas2D fallback smokes + cross-engine determinism (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers + OS deps for chromium (WebGPU render smoke), webkit and
      # firefox (Canvas2D fallback smoke, cross-engine determinism gate).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # playwright.config.ts's webServer runs `npm run build && npm run start`
      # (never `next dev`); the smokes tolerate a GPU-less runner by asserting
      # the Canvas2D fallback engaged. This job intentionally rebuilds; Plan
      # 3B may optimize by sharing the build-and-test artifact.
      - name: Run render + fallback smokes
        run: npx playwright test

      # Plan 3B Task 8: asserts the committed golden replay
      # (src/game/test/determinism.golden.json) reproduces the Node golden
      # hash in Chromium, Firefox AND WebKit — the correctness anchor the
      # leaderboard rests on. Reuses this job's already-installed browsers
      # instead of a separate job that would duplicate the install step.
      # Runs under its own playwright.cross-engine.config.ts (no webServer —
      # this spec never touches the Next.js app; it launches each engine
      # directly and injects an esbuild bundle of the pure sim into a blank
      # page), so it doesn't pay for another build+start on top of the one
      # above.
      - name: Cross-engine determinism gate (golden hash)
        run: npx playwright test --config=playwright.cross-engine.config.ts
